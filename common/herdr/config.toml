onboarding = false

# Installed plugins (reinstall manually on new machines and update this list when plugins change):
# - ChmaraX/herdr-nvim

[keys]
focus_pane_left = ["prefix+h", "alt+left"]
focus_pane_down = ["prefix+j", "alt+down"]
focus_pane_up = ["prefix+k", "alt+up"]
focus_pane_right = ["prefix+l", "alt+right"]

previous_tab = ["prefix+p", "shift+left"]
next_tab = "shift+right"
new_tab = ["prefix+c", "prefix+n"]
rename_tab = ["prefix+shift+t", "prefix+r"]

previous_workspace = "ctrl+up"
next_workspace = "ctrl+down"
last_pane = ["ctrl+tab", "alt+tab"]

previous_agent = "shift+up"
next_agent = "shift+down"

split_vertical = ["prefix+|"]

[[keys.command]]
key = "prefix+shift+k"
type = "popup"
command = "$HOME/dev/personal/dotfiles/scripts/tmux/port-killer.sh"
description = "kill process by listening port"
width = "90%"
height = "70%"

[[keys.command]]
key = "prefix+shift+a"
type = "popup"
command = "$HOME/dev/personal/dotfiles/scripts/herdr/rename-agent.sh"
description = "rename focused agent"

[[keys.command]]
key = "prefix+shift+r"
type = "popup"
command = "$HOME/dev/personal/dotfiles/scripts/herdr/start-pr-reviews.sh rpi"
description = "start blind PR reviews"
width = "90%"
height = "70%"

[[keys.command]]
key = "prefix+v"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

[theme]
name = "catppuccin"
auto_switch = false

# Apollo Guidance Computer palette.
[theme.custom]
accent = "#E5A83C"
panel_bg = "#191A1B"
sidebar_bg = "#101112"
active_row_bg = "#44381F"
selection_bg = "#514A37"
surface0 = "#514A37"
surface1 = "#44381F"
surface_dim = "#877F64"
overlay0 = "#877F64"
overlay1 = "#A39978"
text = "#EEE5C8"
subtext0 = "#A39978"
mauve = "#E5A83C"
green = "#A4AC7A"
yellow = "#E5A83C"
red = "#C98265"
blue = "#99ADA4"
teal = "#99ADA4"
peach = "#E5A83C"

[ui]
pane_borders = true
pane_gaps = false
show_agent_labels_on_pane_borders = false
agent_panel_sort = "spaces"
tab_bar_position = "bottom"
